name: validate-nango-package

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  package-and-static-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Package and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package.ps1
          ./scripts/test.ps1
      - name: Package and test on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash ./scripts/package.sh
          bash ./scripts/test.sh
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run bounded Docker smoke
        shell: bash
        run: bash ./scripts/verify.sh
