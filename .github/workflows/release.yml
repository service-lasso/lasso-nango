name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            artifact: dist/lasso-nango-win32.zip
          - os: ubuntu-latest
            platform: linux
            artifact: dist/lasso-nango-linux.tar.gz
          - os: macos-14
            platform: darwin
            artifact: dist/lasso-nango-darwin.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Package and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package.ps1
          ./scripts/test.ps1
      - name: Package and test on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash ./scripts/package.sh
          bash ./scripts/test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lasso-nango-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
  release:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: lasso-nango-*
          merge-multiple: true
      - name: Assemble checksums and manifest
        shell: bash
        run: |
          set -euo pipefail
          cp service.json release-assets/service.json
          (cd release-assets && sha256sum lasso-nango-win32.zip lasso-nango-linux.tar.gz lasso-nango-darwin.tar.gz > SHA256SUMS.txt)
      - name: Compute release version
        id: version
        shell: bash
        run: echo "version=$(date -u +%Y.%-m.%-d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            release-assets/lasso-nango-win32.zip
            release-assets/lasso-nango-linux.tar.gz
            release-assets/lasso-nango-darwin.tar.gz
            release-assets/service.json
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
